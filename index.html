<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMOKE HUB PRO</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <div class="logo-container">
            <img src="assets/smoke-hub-logo.jpeg" alt="SMOKE HUB Logo" class="logo">
            <h1>SMOKE HUB PRO</h1>
        </div>
        <div class="header-actions">
            <button id="cartBtn" class="btn" onclick="toggleCart()">🛒 Кошик (<span id="cartCount">0</span>)</button>
            <button id="adminBtn" class="btn btn-outline" onclick="toggleAdmin()">⚙️ Адмінка</button>
        </div>
    </header>

    <main class="container">
        <!-- КАТАЛОГ -->
        <section id="catalogSection">
            <h2>Каталог товарів</h2>
            <div id="productGrid" class="product-grid">
                <!-- Товари завантажуються з Firestore -->
            </div>
        </section>

        <!-- АДМІН ПАНЕЛЬ -->
        <section id="adminSection" class="admin-section hidden">
            <h2>Управління магазином</h2>
            
            <div class="admin-tabs">
                <button class="tab-btn active" onclick="switchAdminTab('productsTab')">Товари</button>
                <button class="tab-btn" onclick="switchAdminTab('ordersTab')">Замовлення</button>
            </div>

            <div id="productsTab" class="tab-content">
                <h3>Додати / Редагувати товар</h3>
                <form id="productForm" onsubmit="handleProductSubmit(event)">
                    <input type="hidden" id="editProductId">
                    <div class="form-group">
                        <label>Назва товару:</label>
                        <input type="text" id="prodName" required>
                    </div>
                    <div class="form-group">
                        <label>Опис:</label>
                        <textarea id="prodDesc" rows="2"></textarea>
                    </div>
                    <div class="form-group">
                        <label>URL Фотографії:</label>
                        <input type="url" id="prodImage" placeholder="https://..." required>
                    </div>
                    <div class="form-group">
                        <label>Базова ціна (1 шт, zł):</label>
                        <input type="number" step="0.01" id="prodPrice" required>
                    </div>
                    <div class="form-group">
                        <label>Залишок на складі (шт):</label>
                        <input type="number" id="prodStock" required>
                    </div>

                    <h4>Оптові рівні цін (Tier Pricing)</h4>
                    <div id="tierList"></div>
                    <button type="button" class="btn btn-sm" onclick="addTierInput()">+ Додати оптовий рівень</button>

                    <br><br>
                    <button type="submit" class="btn btn-primary">Зберегти товар</button>
                    <button type="button" class="btn btn-secondary" onclick="resetProductForm()">Очистити</button>
                </form>

                <h3 style="margin-top:20px;">Список товарів у базі</h3>
                <div id="adminProductList" class="admin-product-list"></div>
            </div>

            <div id="ordersTab" class="tab-content hidden">
                <h3>Всі замовлення</h3>
                <div id="adminOrdersList" class="admin-orders-list"></div>
            </div>
        </section>
    </main>

    <!-- МОДАЛЬНЕ ВІКНО КОШИКА -->
    <div id="cartModal" class="modal hidden">
        <div class="modal-content">
            <span class="close-btn" onclick="toggleCart()">&times;</span>
            <h2>Ваш кошик</h2>
            <div id="cartItemsList"></div>
            <div class="cart-summary">
                <h3>Загалом: <span id="cartTotal">0</span> zł</h3>
            </div>
            
            <form id="checkoutForm" onsubmit="handleCheckoutSubmit(event)">
                <h3>Оформлення замовлення</h3>
                <div class="form-group">
                    <label>Ім'я та Прізвище / Telegram:</label>
                    <input type="text" id="custName" required placeholder="@username або ім'я">
                </div>
                <div class="form-group">
                    <label>Телефон:</label>
                    <input type="tel" id="custPhone" required placeholder="+48...">
                </div>
                <div class="form-group">
                    <label>Адреса / Місто доставки (Łódź / Поштомат):</label>
                    <input type="text" id="custAddress" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Оформити замовлення</button>
            </form>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
